[build]
  base = "website"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Umami analytics through our own domain (shared mduppes.com website; filter by hostname).
[[redirects]]
  from = "/u/script.js"
  to = "https://cloud.umami.is/script.js"
  status = 200

[[redirects]]
  from = "/u/api/*"
  to = "https://gateway.umami.is/api/:splat"
  status = 200
